spring:
  application:
    name: medichannel-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medichannel?sslmode=disable}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:106sc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Colombo
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

medichannel:
  jwt:
    secret: ${JWT_SECRET:superSecretKeyForMediChannelJwtMustBeAtLeast32BytesLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  crypto:
    aes-key: ${AES_256_KEY:dGhpc0lzQTMyeXRlTG9uZ0FFUzI1NktleUZvclRlc3Rpbmc=}
    hmac-key: ${HMAC_SHA256_KEY:dGhpc0lzQVRlc3RITUFDU2hhMjU2S2V5TXVzdEJlMzJCeXRlc0xvbmc=}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
  lockout:
    max-attempts: 5
    duration-minutes: 15
  cache:
    public-ttl-seconds: ${PUBLIC_CACHE_TTL_SECONDS:120}
  admin:
    email: ${ADMIN_EMAIL:admin@lankacare.lk}
    password: ${ADMIN_PASSWORD:AdminPassword#2026}
    full-name: ${ADMIN_FULL_NAME:System Administrator}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
